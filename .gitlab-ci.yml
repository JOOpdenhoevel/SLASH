workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ( $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "integration_testing" || $CI_COMMIT_BRANCH =~ /^pr\// )

variables:
  SLURM_ACCOUNT: hpc-prf-cifi

default:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  before_script:
    - ml fpga lang Python xilinx/vivado/25.1
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

hello_world:
  tags:
    - otus
  variables:
    SCHEDULER_PARAMETERS: "-A $SLURM_ACCOUNT -p normal -c 16 --mem 16G -t 00:05:00"
  script:
    - echo "Hello World from $(hostname)! My name is $(whoami) and I have $(nproc) cores!"

build_abstract_shell:
  tags:
    - otus
  variables:
    SCHEDULER_PARAMETERS: "-A $SLURM_ACCOUNT -p normal -c 16 --mem 128G -t 12:00:00"
  script:
    - cd linker
    - make -C resources/base/iprepo/hbm_bandwidth/ -j16
    - make -C resources/base/iprepo/traffic_producer/ -j16
    - python3 ./src/main.py install --jobs 16
  artifacts:
    name: abstract_shell
    public: false
    when: always
    paths:
      - linker/resources/base/iprepo/hbm_bandwidth/ip/
      - linker/resources/base/iprepo/traffic_producer/ip/
      - linker/resources/abstract_shell
      - linker/resources/install.prj/vivado.log
    