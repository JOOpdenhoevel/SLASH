;
; slash-emu configuration file.
;
; The daemon exposes one or more system-emulated SLASH accelerators as a FUSE
; tree under its mount path.  The configurable surface is intentionally small:
; per the architecture, only the accelerator BDF and (reserved) network settings
; are configurable; everything else is hard-wired.
;
; FORMAT
; ------
; One section per accelerator, keyed by its board-level PCI BDF:
;
;   [accelerator:<DDDD:BB:DD>]
;
; The BDF is the per-device folder name used under the mount path (matching
; /dev/slash/<BDF> on hardware).  It is a board-level address -- domain, bus,
; and device -- WITHOUT a function suffix.  Both the canonical "DDDD:BB:DD" form
; and the short "BB:DD" form (domain defaults to 0000) are accepted and
; normalized to lower-case canonical form.  A ".F" function suffix is rejected.
;
; Duplicate BDFs (after normalization) and malformed BDFs are configuration
; errors and cause the daemon to refuse to start.
;
; IMPORTANT: each [accelerator:<bdf>] section MUST carry at least one key.
; slash-emu uses the system libinih, whose parser reports a section only once it
; has a key -- a KEYLESS section is SILENTLY IGNORED (the accelerator will not be
; created).  Give every accelerator at least one reserved net-* key (below) so it
; is never dropped.
;
; RESERVED KEYS (network configuration)
; -------------------------------------
; The schema reserves space for future per-accelerator network configuration.
; These keys are parsed for forward compatibility but are NOT acted upon yet:
;
;   net-mac  = <mac address string>
;   net-ip   = <ip address string>
;   net-port = <port string>
;
; Any key other than the reserved network keys, and any section other than an
; [accelerator:<bdf>] section, is a configuration error.

; A single emulated accelerator at domain 0000, bus 61, device 00.  It carries a
; reserved net-ip key so the (otherwise keyless) section is not silently ignored.
[accelerator:0000:61:00]
net-ip = 10.0.0.1

; A second accelerator, with the full reserved network configuration filled in.
; The net-* keys are inert today; they document the intended forward-compatible
; schema only.
[accelerator:0000:62:00]
net-mac  = 02:00:00:00:00:02
net-ip   = 10.0.0.2
net-port = 4791
